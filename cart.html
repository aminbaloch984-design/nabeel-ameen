<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart — LaptopHub</title>
  <meta name="description" content="Review the laptops in your LaptopHub cart, adjust quantities and proceed to a secure demo checkout.">
  <link rel="icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div id="cart-root">
      <div class="container" style="padding:64px 24px">
        <p class="muted">Loading your cart…</p>
      </div>
    </div>
    <noscript>
      <div class="container" style="padding:0 24px 48px">
        <p class="muted">Please enable JavaScript to use the cart. Your cart is stored locally in this browser.</p>
      </div>
    </noscript>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
</body>
</html>

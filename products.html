<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Laptops — LaptopHub</title>
  <meta name="description" content="Browse every laptop at LaptopHub — filter by brand, price, memory and category, then compare specs and buy online with nationwide delivery.">
  <link rel="icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="container page-head__inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          <strong>All laptops</strong>
        </nav>

        <div class="page-head__row">
          <div>
            <h1>All Laptops</h1>
            <p class="lead">
              Fourteen hand-picked machines across gaming, business, student,
              creator and ultrabook categories. Filter by what matters, compare
              honestly, buy with confidence.
            </p>
          </div>
          <div class="page-head__stats">
            <div><b>14</b><span>Models listed</span></div>
            <div><b>7</b><span>Brands</span></div>
            <div><b>1 yr</b><span>Warranty</span></div>
          </div>
        </div>
      </div>
    </section>

    <div class="container">
      <div class="catalog">
        <aside class="filters" id="filters-panel" aria-label="Product filters">
          <div class="filters__box" id="filters-body"></div>
        </aside>

        <div class="catalog__main">
          <div class="toolbar">
            <div class="search-field">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <label class="sr-only" for="catalog-search">Search products</label>
              <input id="catalog-search" class="field" type="search" placeholder="Search by model, brand, processor…" autocomplete="off">
            </div>

            <div class="toolbar__right">
              <button type="button" class="btn btn--ghost filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters-panel">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
                Filters
                <span class="filters-toggle__count" id="filter-count" hidden>0</span>
              </button>

              <label class="sr-only" for="sort">Sort products</label>
              <select id="sort" class="field">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="rating">Top rated</option>
                <option value="discount">Biggest discount</option>
              </select>
            </div>
          </div>

          <div class="result-bar" id="result-bar" aria-live="polite"></div>
          <div class="catalog__grid" id="catalog-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
</body>
</html>
